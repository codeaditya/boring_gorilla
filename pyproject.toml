[project]
name = "BoringGorilla"
version = "2026.10.26"
description = "Downloads and processes data for Stock Markets"
requires-python = ">=3.14"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [
    {name = "Aditya", email = "code.aditya@gmail.com"},
]
dependencies = [
    "PyQt6>=6.11.0",
    "comtypes>=1.4.17",
    "trader @ git+https://github.com/codeaditya/trader.git",
]
keywords = ["nse", "stocks", "bhavcopy"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Financial :: Investment",
]

[dependency-groups]
dev = [
    "cx_Freeze>=8.7.3",
]

[project.urls]
Homepage = "https://github.com/codeaditya/boring_gorilla"
Repository = "https://github.com/codeaditya/boring_gorilla"
Issues = "https://github.com/codeaditya/boring_gorilla/issues"

[tool.cxfreeze]
executables = [
    {script = "BoringGorilla.py", base = "gui"},
]

[tool.cxfreeze.build_exe]
include-files = ["LICENSE.txt"]
silent = true

# ... other project metadata fields as listed in:
#     https://packaging.python.org/en/latest/guides/writing-pyproject-toml/
